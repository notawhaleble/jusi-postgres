[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jusi-postgres"
version = "0.1.0"
description = "PostgreSQL provider plugin for Jusi SQL"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "Jusi contributors" }
]
dependencies = [
  "jusi",
  "jusi-sql",
  "psycopg[binary]>=3.1",
  "sqlparse>=0.4",
  "visidata>=3,<4",
]

[project.entry-points."jusi.display_handlers"]
postgres = "jusi_postgres.plugin:display_handler_specs"

[tool.hatch.build.targets.wheel]
packages = ["src/jusi_postgres"]

[tool.pytest.ini_options]
pythonpath = ["src"]
